spring:
  config:
    activate:
      on-profile: prod
server:
  port: ${PORT:8080}
  application:
    name: spring-lms

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false
